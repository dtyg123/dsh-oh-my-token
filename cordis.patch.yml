# Bundle patch for dsh-oh-my-token.
#
# One row, every tunable in `config`. Edit this patch, not the source.
#
# The five `filters` switches, the two `retrieval` switches and the whole
# `prose` block can also be flipped from Settings → 省 Token without editing
# this file; the page writes its choice to dsh-oh-my-token.state.json in the
# profile directory, and that file wins over this config on the next start.
- insert:
    - id: oh-my-token
      name: dsh-oh-my-token
      config:
        enabled: true

        # Character budgets. 6000 chars is roughly 1500-1700 English tokens.
        # `read` gets more because file content is the substrate for edits.
        budgets:
          default: 6000
          read: 12000
          grep: 6000
          bash: 4000
          errorFactor: 2

        # Leave small results alone.
        minChars: 800
        # Discard a rewrite that saves less than this fraction.
        minGain: 0.05

        filters:
          pytest: true
          git: true
          tsc: true
          packageManager: true
          generic: true

        retrieval:
          # Only outline a read when the file is larger than this and the model
          # did not pass offset/limit.
          readOutlineOverLines: 400
          maxOutlineSymbols: 60
          maxGrepMatches: 50

        prose:
          # Tidy punctuation on prose lines: drop a mark opening a paragraph,
          # collapse two stuck-together marks to one (a comma + period keep
          # the period), and drop the run of trailing `.` / `。` / `,` / `，`.
          # Code, diffs, paths, URLs, versions and decimals are never touched.
          # scope: filtered (only prose outputs such as git log) | all | off.
          stripTrailingPeriod: true
          # Word delete/replace: each entry is { word, replace? }; empty or
          # omitted replace deletes the word, a string replaces it. The built-in
          # list is shown in Settings and includes 谢谢 / 好的 / 请 / please /
          # thanks and speech particles such as 啊 / 呀 / 吧 / 呢. Particles are
          # deleted only at a phrase end, so 酒吧 / 网吧 / 毛呢 / 哗啦 survive.
          # When keepWholeLine is true, a line made up of one listed word is kept.
          # URLs, paths, links and code-like lines are never rewritten.
          # stripPoliteness: true
          keepWholeLine: true
          # politenessWords:
          #   - word: 谢谢
          #   - word: 请
          #     replace: 拜托
          stripPoliteness: true
          scope: filtered

        # spill: save full text through ctx.spillStore when available, else
        # fall back to a re-run hint. none: never elide without a handle.
        recovery: spill

        # 0 disables periodic stats logging.
        logEvery: 0
